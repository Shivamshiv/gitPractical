spring.application.name=bookmyshow

# MySQL DB Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bookMyShow?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Using update for dev environment to auto-generate tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Razorpay Configuration
razorpay.key.id=your_razorpay_key_id
razorpay.key.secret=your_razorpay_key_secret

# Stripe Configuration
stripe.api.key=your_stripe_api_key
stripe.publishable.key=your_stripe_publishable_key
